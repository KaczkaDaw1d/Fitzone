databases:
  - name: fitzone-db
    databaseName: fitzone
    user: fitzone
    plan: basic-256mb
    region: frankfurt
    ipAllowList: []
services:
  - type: web
    name: fitzone
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitzone-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
